name: CNBV probe
on:
  push:
    branches: [cnbv-probe]
    paths: ["probe/probe_cnbv.py", ".github/workflows/cnbv_probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests openpyxl
      - run: python probe/probe_cnbv.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/cnbv_probe.txt && git commit -m "probe: cnbv structure" && git push origin HEAD:cnbv-probe
