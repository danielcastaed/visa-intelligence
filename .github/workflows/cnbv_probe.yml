name: CNBV probe
on:
  push:
    branches: [cnbv-probe]
    paths: ["mexico/fetch_cnbv.py", ".github/workflows/cnbv_probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests openpyxl cryptography certifi
      - run: python mexico/fetch_cnbv.py 2>&1 | tee probe/cnbv_probe.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/cnbv_probe.txt mexico/data/cnbv_tarjetas.json && git commit -m "probe: cnbv tarjetas" && git push origin HEAD:cnbv-probe
