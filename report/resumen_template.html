<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen · Visa Intelligence Colombia</title>
<style>
:root{
  --visa:#1A1F71; --visa-light:#E8EAF6; --mc:#CC2200; --otras:#98A2B3; --credito:#6941C6; --debito:#F79009; --muted-line:#98A2B3;
  --bg:#F7F8FA; --card:#FFFFFF; --border:#E4E7EC; --text:#101828; --muted:#667085; --faint:#98A2B3;
  --pos:#027A48; --pos-bg:#ECFDF3; --neg:#B42318; --neg-bg:#FEF3F2; --grid:#F2F4F7; --bar:#8E96D6;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
header{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:12px;flex-wrap:wrap}
header .brand{font-weight:800;color:var(--visa);letter-spacing:.2px}
header .brand span{color:var(--muted);font-weight:500}
header a{font-size:12px;color:var(--visa);text-decoration:none}
header a:hover{text-decoration:underline}
.tabs{width:100%;max-width:880px;display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:10px;padding:10px 8px;font-size:14px;font-weight:700;cursor:pointer;line-height:1.2}
.tabs button small{display:block;font-weight:500;font-size:11px;margin-top:2px;color:var(--faint)}
.tabs button:hover{border-color:var(--visa);color:var(--visa)}
.tabs button.on{background:var(--visa);border-color:var(--visa);color:#fff}
.tabs button.on small{color:#C7CBF0}
.stage{position:relative;width:100%;max-width:880px;height:530px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.scene{position:absolute;inset:0;padding:30px 40px 34px;display:flex;flex-direction:column;justify-content:center;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.scene.on{opacity:1;visibility:visible}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
h1{font-size:30px;line-height:1.15;font-weight:800;max-width:700px}
h2{font-size:22px;line-height:1.2;font-weight:800;margin-bottom:6px;max-width:760px}
.sub{color:var(--muted);font-size:14px;margin-top:8px;max-width:700px;line-height:1.45}
.big{font-size:84px;font-weight:800;color:var(--visa);line-height:1;margin:22px 0 8px;font-variant-numeric:tabular-nums}
.big small{font-size:34px;color:var(--muted);font-weight:700}
.chip{display:inline-block;font-size:14px;font-weight:700;padding:5px 12px;border-radius:99px}
.chip.neg{background:var(--neg-bg);color:var(--neg)}.chip.pos{background:var(--pos-bg);color:var(--pos)}.chip.flat{background:var(--grid);color:var(--muted)}

.mbar{margin:14px 0 4px}
.mbar .lbl{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;margin-bottom:6px}
.mbar .lbl span:last-child{color:var(--muted);font-weight:500}
.track{display:flex;height:44px;border-radius:8px;overflow:hidden;background:var(--grid)}
.seg{height:100%;width:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;transition:width 1.1s cubic-bezier(.2,.8,.2,1);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.seg.v{background:var(--visa)}.seg.m{background:var(--mc)}.seg.o{background:var(--otras)}
.tiles{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.tiles div{flex:1;min-width:150px;border:1px solid var(--border);border-radius:10px;padding:10px 14px;opacity:0;transform:translateY(8px);transition:all .6s ease}
.tiles.show div{opacity:1;transform:none}
.tiles div:nth-child(2){transition-delay:.15s}.tiles div:nth-child(3){transition-delay:.3s}
.tiles b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tiles span{font-size:12px;color:var(--muted)}

.cbars{margin-top:12px}
.crow{display:grid;grid-template-columns:140px 1fr 70px;align-items:center;gap:10px;height:30px;font-size:13px}
.crow .name{text-align:right;font-weight:600}
.crow .area{position:relative;height:18px}
.crow .area::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:var(--border)}
.crow .bar{position:absolute;top:0;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);border-radius:3px}
.crow .bar.pos{left:50%;background:var(--pos)}.crow .bar.neg{right:50%;background:var(--neg)}
.crow .val{font-variant-numeric:tabular-nums;font-weight:700;opacity:0;transition:opacity .4s ease .7s}
.crow .val.pos{color:var(--pos)}.crow .val.neg{color:var(--neg)}
.on .crow .val{opacity:1}
.sep{height:10px}

svg.chart{width:100%;height:auto;margin-top:6px}
svg.chart .grid{stroke:var(--grid)}
svg.chart text{font-size:11px;fill:var(--muted)}
svg.chart .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg.chart .dash{stroke-dasharray:7 6}
svg.chart .pt{opacity:0;transition:opacity .4s ease 1.4s}
.on svg.chart .pt{opacity:1}
svg.chart .col{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.on svg.chart .col{transform:scaleY(1)}
svg.chart .vlab{opacity:0;transition:opacity .4s ease .9s;font-weight:700;fill:var(--text)}
.on svg.chart .vlab{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.legend i.d{border-top-style:dashed}
.legend i.sq{width:11px;height:11px;border:0;border-radius:3px}

.read{list-style:none;padding:0;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.read li{display:flex;gap:12px;font-size:15px;line-height:1.42;opacity:0;transform:translateX(-10px);transition:all .6s ease}
.on .read li{opacity:1;transform:none}
.on .read li:nth-child(2){transition-delay:.4s}.on .read li:nth-child(3){transition-delay:.8s}.on .read li:nth-child(4){transition-delay:1.2s}.on .read li:nth-child(5){transition-delay:1.6s}.on .read li:nth-child(6){transition-delay:2s}.on .read li:nth-child(7){transition-delay:2.4s}
.read li i{flex:0 0 26px;height:26px;border-radius:50%;background:var(--visa-light);color:var(--visa);font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.note{font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.5;max-width:720px}

.controls{width:100%;max-width:880px;display:flex;align-items:center;gap:14px;margin-top:14px}
.controls button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;height:36px;min-width:36px;padding:0 12px;font-size:14px;cursor:pointer}
.controls button:hover{border-color:var(--visa);color:var(--visa)}
.dots{display:flex;gap:6px;flex:1;min-width:0;justify-content:center}
.dots button{min-width:0;flex:1 1 0;max-width:30px;height:6px;padding:0;border-radius:3px;border:0;background:var(--border)}
.dots button.on{background:var(--visa)}
.progress{position:absolute;left:0;bottom:0;height:3px;background:var(--visa);width:0}
.foot{width:100%;max-width:880px;font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.5}
@media (max-width:640px){
  .stage{height:650px}.scene{padding:22px 18px 28px}
  .controls{gap:8px}
  h1{font-size:23px}h2{font-size:18px}.big{font-size:60px}.big small{font-size:26px}
  .crow{grid-template-columns:96px 1fr 56px;font-size:12px}
  .tabs button{font-size:12px}.tabs button small{display:none}
  .read li{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">Visa Intelligence <span>· Colombia</span></div>
  <a href="./">Ver dashboard completo →</a>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="stage" id="stage"></div>
<div class="controls">
  <button id="prev" aria-label="Anterior">←</button>
  <button id="play" aria-label="Reproducir o pausar">⏸</button>
  <button id="next" aria-label="Siguiente">→</button>
  <div class="dots" id="dots"></div>
</div>
<p class="foot" id="foot"></p>

<script>
const DATA = /*__DATA__*/null;

const COL = {visa:"#1A1F71", mc:"#CC2200", otras:"#98A2B3", credito:"#6941C6", debito:"#F79009", muted:"#98A2B3"};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (t,c,h)=>{const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e};
const NS = "http://www.w3.org/2000/svg";
const sv = (t,a={})=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e};
const fmtV = (v,fmt)=> fmt==="%" ? v.toFixed(1)+"%" : fmt.replace("{:.0f}",Math.round(v));

/* ── Renderizadores: cada uno arma la escena y devuelve enter() ─────────── */
const R = {
  hero(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h1",0,sc.title));
    const big=$("div","big"), n=$("span",0,""), u=$("small",0,sc.num.suffix); big.append(n,u); el.append(big);
    el.append($("div",0,`<span class="chip ${sc.chip.cls}">${sc.chip.text}</span>`), $("p","sub",sc.sub));
    const f=sc.num.from,t=sc.num.to,d=sc.num.decimals;
    return ()=>{ if(reduce){n.textContent=t.toFixed(d);return}
      const t0=performance.now(); (function tick(x){const k=Math.min(1,(x-t0)/1600),e=1-Math.pow(1-k,3);
        n.textContent=(f+(t-f)*e).toFixed(d); if(k<1) requestAnimationFrame(tick)})(t0); };
  },
  stack(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h2",0,sc.title));
    const tracks=[];
    sc.rows.forEach(r=>{
      const m=$("div","mbar",`<div class="lbl"><span>${r.label}</span><span>${r.right}</span></div>`), tr=$("div","track");
      r.segs.forEach(s=>{tr.append($("div","seg "+s.k))}); m.append(tr); el.append(m); tracks.push([tr,r]);
    });
    const tiles=$("div","tiles"); sc.tiles.forEach(t=>tiles.append($("div",0,`<b>${t.value}</b><span>${t.label}</span>`))); el.append(tiles);
    const set=on=>tracks.forEach(([tr,r])=>[...tr.children].forEach((s,i)=>{const v=r.segs[i].val; s.style.width=on?v+"%":"0"; s.textContent=on&&v>5?v.toFixed(1)+"%":""}));
    return ()=>{ set(false); tiles.classList.remove("show");
      requestAnimationFrame(()=>requestAnimationFrame(()=>{set(true); setTimeout(()=>tiles.classList.add("show"),reduce?0:900)})) };
  },
  contrib(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h2",0,sc.title), $("div","sub",sc.sub)); el.lastChild.style.marginTop="0";
    const box=$("div","cbars"); el.append(box);
    sc.items.forEach(c=>{
      if(!c){box.append($("div","sep"));return}
      const cls=c.val>=0?"pos":"neg", s=(c.val>0?"+":c.val<0?"−":"")+Math.abs(c.val).toFixed(2);
      box.append($("div","crow",`<div class="name">${c.name}</div><div class="area"><div class="bar ${cls}" data-w="${Math.abs(c.val)/sc.max*50}"></div></div><div class="val ${cls}">${s} pp</div>`));
    });
    const set=on=>box.querySelectorAll(".bar").forEach((b,i)=>{b.style.transitionDelay=on?(i*.12)+"s":"0s"; b.style.width=on?b.dataset.w+"%":"0"});
    return ()=>{set(false); requestAnimationFrame(()=>requestAnimationFrame(()=>set(true)))};
  },
  line(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h2",0,sc.title)); if(sc.sub) el.append($("p","sub",sc.sub));
    const W=800,H=250,pl=44,pr=64,pt=16,pb=30, n=sc.labels.length;
    const all=sc.series.flatMap(s=>s.values), mn=Math.min(...all), mx=Math.max(...all), span=mx-mn;
    const step=span<=4?1:span<=10?2:span<=25?5:10, lo=Math.floor((mn-span*.12)/step)*step, hi=Math.ceil((mx+span*.12)/step)*step;
    const x=i=>pl+i*(W-pl-pr)/Math.max(1,n-1), y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
    const svg=sv("svg",{class:"chart",viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":sc.title});
    for(let g=lo;g<=hi+1e-9;g+=step){svg.append(sv("line",{class:"grid",x1:pl,x2:W-pr,y1:y(g),y2:y(g)})); const t=sv("text",{x:pl-8,y:y(g)+4,"text-anchor":"end"}); t.textContent=g+"%"; svg.append(t)}
    const every=Math.ceil(n/8);
    sc.labels.forEach((l,i)=>{ if(i%every===0||i===n-1){const t=sv("text",{x:x(i),y:H-8,"text-anchor":"middle"}); t.textContent=l; svg.append(t)} });
    const paths=[];
    sc.series.forEach(s=>{
      const p=sv("path",{class:"ln"+(s.dash?" dash":""),stroke:COL[s.color],d:"M"+s.values.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" L")}); svg.append(p); paths.push([p,s]);
      const li=s.values.length-1, g=sv("g",{class:"pt"});
      g.append(sv("circle",{cx:x(li),cy:y(s.values[li]),r:5,fill:COL[s.color]}));
      const t=sv("text",{x:x(li)+10,y:y(s.values[li])+4,style:"font-weight:800;font-size:12px;fill:"+COL[s.color]}); t.textContent=s.values[li].toFixed(1)+"%"; g.append(t); svg.append(g);
    });
    el.append(svg);
    if(sc.series.length>1){const lg=$("div","legend"); sc.series.forEach(s=>lg.append($("span",0,`<i class="${s.dash?"d":""}" style="border-color:${COL[s.color]}"></i>${s.name}`))); el.append(lg)}
    return ()=>paths.forEach(([p,s])=>{const L=p.getTotalLength(); p.style.transition="none"; p.style.strokeDasharray=s.dash?"7 6":L; p.style.strokeDashoffset=0;
      if(!reduce&&!s.dash){p.style.strokeDashoffset=L; p.getBoundingClientRect(); p.style.transition="stroke-dashoffset 1.6s ease"; p.style.strokeDashoffset=0}
      if(!reduce&&s.dash){p.style.opacity=0; p.getBoundingClientRect(); p.style.transition="opacity 1.2s ease .3s"; p.style.opacity=1}});
  },
  columns(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h2",0,sc.title)); if(sc.sub) el.append($("p","sub",sc.sub));
    const W=800,H=260,pl=10,pr=10,pt=30,pb=28,n=sc.values.length, mx=Math.max(...sc.values)*1.08, bw=(W-pl-pr)/n;
    const svg=sv("svg",{class:"chart",viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":sc.title});
    sc.values.forEach((v,i)=>{
      const h=v/mx*(H-pt-pb), bx=pl+i*bw+bw*.16, w=bw*.68, last=i===n-1;
      const r=sv("rect",{class:"col",x:bx,y:H-pb-h,width:w,height:h,rx:3,fill:last?COL.visa:"#8E96D6",style:`transition-delay:${i*.06}s`}); svg.append(r);
      const t=sv("text",{class:"vlab",x:bx+w/2,y:H-pb-h-6,"text-anchor":"middle",style:`font-size:11px;transition-delay:${.5+i*.06}s`}); t.textContent=fmtV(v,sc.fmt); svg.append(t);
      const l=sv("text",{x:bx+w/2,y:H-8,"text-anchor":"middle"}); l.textContent=sc.labels[i]; svg.append(l);
    });
    (sc.annot||[]).forEach(a=>{const bx=pl+a.i*bw+bw/2, h=sc.values[a.i]/mx*(H-pt-pb);
      const t=sv("text",{class:"vlab",x:bx,y:H-pb-h-20,"text-anchor":"middle",style:"font-size:10px;fill:#B42318;font-weight:700"}); t.textContent=a.text; svg.append(t)});
    el.append(svg);
    return ()=>{};
  },
  stackcols(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h2",0,sc.title)); if(sc.sub) el.append($("p","sub",sc.sub));
    const abs=sc.mode==="abs";
    const W=800,H=abs?215:260,pl=10,pr=10,pt=abs?34:10,pb=28,n=sc.labels.length,bw=(W-pl-pr)/n;
    const tot=sc.labels.map((_,i)=>sc.series.reduce((a,s)=>a+s.values[i],0)), mx=abs?Math.max(...tot):100;
    const svg=sv("svg",{class:"chart",viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":sc.title});
    for(let i=0;i<n;i++){
      let acc=0; const bx=pl+i*bw+bw*.12, w=bw*.76;
      sc.series.forEach((s,k)=>{
        const v=s.values[i], h=v/mx*(H-pt-pb), yy=H-pb-acc-h; acc+=h;
        svg.append(sv("rect",{class:"col",x:bx,y:yy,width:w,height:h,fill:COL[s.color],style:`transition-delay:${i*.05}s`}));
        if(!abs||(h>=15&&s.name!=="Otras")){
          const t=sv("text",{class:"vlab",x:bx+w/2,y:yy+h/2+4,"text-anchor":"middle",style:"font-size:10px;fill:#fff;transition-delay:"+(.5+i*.05)+"s"}); t.textContent=abs?Math.round(v):Math.round(v)+"%"; svg.append(t);
        }
      });
      if(abs){
        const y0=H-pb-acc;
        const t=sv("text",{class:"vlab",x:bx+w/2,y:y0-6,"text-anchor":"middle",style:`font-size:11px;transition-delay:${.5+i*.05}s`}); t.textContent=fmtV(tot[i],sc.fmt); svg.append(t);
        (sc.annot||[]).filter(a=>a.i===i).forEach(a=>{const u=sv("text",{class:"vlab",x:bx+w/2,y:y0-20,"text-anchor":"middle",style:"font-size:10px;fill:#B42318;font-weight:700"}); u.textContent=a.text; svg.append(u)});
      }
      const l=sv("text",{x:bx+w/2,y:H-8,"text-anchor":"middle"}); l.textContent=sc.labels[i]; svg.append(l);
    }
    el.append(svg);
    const lg=$("div","legend"); sc.series.forEach(s=>lg.append($("span",0,`<i class="sq" style="background:${COL[s.color]}"></i>${s.name}`))); el.append(lg);
    let tiles=null;
    if(sc.tiles){ tiles=$("div","tiles"); tiles.style.marginTop="14px"; sc.tiles.forEach(x=>tiles.append($("div",0,`<b>${x.value}</b><span>${x.label}</span>`))); el.append(tiles); }
    return ()=>{ if(tiles){ tiles.classList.remove("show"); setTimeout(()=>tiles.classList.add("show"),reduce?0:900) } };
  },
  read(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h2",0,sc.title));
    const ul=$("ul","read"); sc.items.forEach((t,i)=>ul.append($("li",0,`<i>${i+1}</i><span>${t}</span>`))); el.append(ul);
    if(sc.note) el.append($("p","note",sc.note));
    return ()=>{};
  }
};

/* ── Reproductor ────────────────────────────────────────────────────────── */
const stage=document.getElementById("stage"), tabs=document.getElementById("tabs"), dots=document.getElementById("dots"),
      playBtn=document.getElementById("play"), foot=document.getElementById("foot");
let cur=0, rep=null, scenes=[], enters=[], playing=!reduce, timer=null, raf=null, t0=0;
const prog=$("div","progress");

function buildReport(id){
  rep=DATA.reportes.find(r=>r.id===id)||DATA.reportes[0];
  try{history.replaceState(null,"","#"+rep.id)}catch(e){}
  stage.innerHTML=""; dots.innerHTML=""; scenes=[]; enters=[];
  rep.scenes.forEach((sc,i)=>{
    const el=$("section","scene"); enters.push(R[sc.type](sc,el)); stage.append(el); scenes.push(el);
    const b=$("button"); b.setAttribute("aria-label","Escena "+(i+1)); b.onclick=()=>go(i); dots.append(b);
  });
  stage.append(prog);
  [...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.id===rep.id));
  foot.textContent=`Fuente: Superintendencia Financiera de Colombia (datos.gov.co), corte ${DATA.corte}. Facturación = compras nacionales + exterior, crédito + débito. En débito la franquicia es estimada por proxy (la SFC no la reporta); Nequi se muestra separado de Bancolombia. Textos generados automáticamente con las cifras del período.`;
  go(0);
}
function go(i){
  cur=(i+scenes.length)%scenes.length;
  scenes.forEach((s,k)=>s.classList.toggle("on",k===cur));
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===cur));
  enters[cur](); schedule();
}
function schedule(){
  clearTimeout(timer); cancelAnimationFrame(raf); prog.style.width="0";
  if(!playing) return;
  const dur=rep.scenes[cur].dur||6000; t0=performance.now();
  (function p(t){const k=Math.min(1,(t-t0)/dur); prog.style.width=(k*100)+"%"; if(k<1) raf=requestAnimationFrame(p)})(t0);
  timer=setTimeout(()=>go(cur+1),dur);
}
function setPlaying(v){playing=v; playBtn.textContent=v?"⏸":"▶"; schedule()}

DATA.reportes.forEach(r=>{const b=$("button",0,`${r.tab}<small>${r.label}</small>`); b.dataset.id=r.id; b.onclick=()=>buildReport(r.id); tabs.append(b)});
playBtn.onclick=()=>setPlaying(!playing); playBtn.textContent=playing?"⏸":"▶";
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
addEventListener("keydown",e=>{ if(e.key==="ArrowRight")go(cur+1); else if(e.key==="ArrowLeft")go(cur-1); else if(e.key===" "){e.preventDefault();setPlaying(!playing)} });
addEventListener("hashchange",()=>{ if(location.hash.slice(1)!==rep.id) buildReport(location.hash.slice(1)) });
buildReport(location.hash.slice(1));
</script>
