<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen · Visa Intelligence Colombia</title>
<style>
:root{
  --visa:#1A1F71; --visa-light:#E8EAF6; --mc:#CC2200; --otras:#98A2B3; --credito:#6941C6; --debito:#F79009; --muted-line:#98A2B3;
  --bg:#F7F8FA; --card:#FFFFFF; --border:#E4E7EC; --text:#101828; --muted:#667085; --faint:#98A2B3;
  --pos:#027A48; --pos-bg:#ECFDF3; --neg:#B42318; --neg-bg:#FEF3F2; --grid:#F2F4F7; --bar:#8E96D6;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px clamp(16px,2.5vw,40px) 40px}
header{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:12px;flex-wrap:wrap}
header .brand{font-weight:700;color:var(--visa);letter-spacing:.2px}
header .brand span{color:var(--muted);font-weight:500}
header a{font-size:12px;color:var(--visa);text-decoration:none}
header a:hover{text-decoration:underline}
.filters{width:100%;max-width:1100px;display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.filters .f{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.seg2{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--card)}
.seg2 button{border:0;background:transparent;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg2 button+button{border-left:1px solid var(--border)}
.seg2 button:hover{color:var(--visa)}
.seg2 button:disabled{opacity:.4;cursor:not-allowed}.seg2 button:disabled:hover{color:var(--muted)}
.seg2 button.on{background:var(--visa);color:#fff}
.filters select{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13.5px;font-weight:600;min-width:210px;cursor:pointer}
.filters .reset{border:0;background:none;color:var(--visa);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline}
.filters .reset[hidden]{display:none}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.tabs button:disabled:hover{border-color:var(--border);color:var(--muted)}
.wfgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.wfpanel h3{font-size:clamp(14px,1.1vw,16px);font-weight:700;margin:0 0 2px}
.wfpanel h3.visa{color:var(--visa)}.wfpanel h3.mc{color:var(--mc)}
.wfpanel .rng{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:1px}
.cardsgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.bcard{border:1px solid var(--border);border-radius:12px;padding:14px 20px 12px;border-top:4px solid;text-align:center}
.bcard h3{margin:0 0 2px;font-size:clamp(15px,1.2vw,17px);font-weight:700}
.bigv{font-size:clamp(34px,3.6vw,52px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.bigv.pos{color:var(--pos)}.bigv.neg{color:var(--neg)}.bigv.flat{color:var(--muted)}
.bigl{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.bsmall{font-size:clamp(13px,1vw,14.5px);color:var(--muted);line-height:1.5;font-variant-numeric:tabular-nums}
.cardsgrid+.read{margin-top:14px}
@media (max-width:760px){.wfgrid,.cardsgrid{grid-template-columns:1fr}}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:520px;font-size:16px;line-height:1.5}
.tabs{width:100%;max-width:1100px;display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:10px;padding:12px 8px;font-size:clamp(14px,1.1vw,16px);font-weight:700;cursor:pointer;line-height:1.2}
.tabs button small{display:block;font-weight:500;font-size:11px;margin-top:2px;color:var(--faint)}
.tabs button:hover{border-color:var(--visa);color:var(--visa)}
.tabs button.on{background:var(--visa);border-color:var(--visa);color:#fff}
.tabs button.on small{color:#C7CBF0}
.stage{position:relative;width:100%;max-width:1100px;height:clamp(520px,calc(100vh - 275px),700px);background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.scene{position:absolute;inset:0;padding:34px clamp(40px,4vw,72px) 38px;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.scene.on{opacity:1;visibility:visible}
.eyebrow{font-size:clamp(12px,.95vw,14px);font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
h1{font-size:clamp(28px,2.8vw,40px);line-height:1.15;font-weight:700;max-width:960px}
h2{font-size:clamp(21px,2vw,28px);line-height:1.2;font-weight:700;margin-bottom:6px;max-width:1000px}
.sub{color:var(--muted);font-size:clamp(14px,1.1vw,16px);margin-top:8px;max-width:960px;line-height:1.45}
.big{font-size:clamp(72px,7.5vw,112px);font-weight:700;color:var(--visa);line-height:1;margin:22px 0 8px;font-variant-numeric:tabular-nums}
.big small{font-size:clamp(30px,3vw,44px);color:var(--muted);font-weight:700}
.chip{display:inline-block;font-size:clamp(14px,1.1vw,17px);font-weight:700;padding:5px 12px;border-radius:99px}
.chip.neg{background:var(--neg-bg);color:var(--neg)}.chip.pos{background:var(--pos-bg);color:var(--pos)}.chip.flat{background:var(--grid);color:var(--muted)}

.mbar{margin:14px 0 4px}
.mbar .lbl{display:flex;justify-content:space-between;gap:10px;font-size:clamp(13px,1.1vw,16px);font-weight:700;margin-bottom:6px}
.mbar .lbl span:last-child{color:var(--muted);font-weight:500}
.track{display:flex;height:clamp(44px,6vh,60px);border-radius:8px;overflow:hidden;background:var(--grid)}
.seg{height:100%;width:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:clamp(15px,1.3vw,19px);transition:width 1.1s cubic-bezier(.2,.8,.2,1);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.seg.v{background:var(--visa)}.seg.m{background:var(--mc)}.seg.o{background:var(--otras)}
.tiles{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.tiles div{flex:1;min-width:170px;border:1px solid var(--border);border-radius:10px;padding:10px 14px;opacity:0;transform:translateY(8px);transition:all .6s ease}
.tiles.show div{opacity:1;transform:none}
.tiles div:nth-child(2){transition-delay:.15s}.tiles div:nth-child(3){transition-delay:.3s}
.tiles b{display:block;font-size:clamp(22px,2vw,30px);font-variant-numeric:tabular-nums}
.tiles span{font-size:clamp(12px,1vw,14px);color:var(--muted)}

.cbars{margin-top:12px}
.crow{display:grid;grid-template-columns:clamp(140px,14vw,210px) 1fr 80px;align-items:center;gap:12px;height:clamp(30px,4.6vh,46px);font-size:clamp(13px,1.1vw,16px)}
.crow .name{text-align:right;font-weight:600}
.crow .area{position:relative;height:clamp(18px,2.6vh,26px)}
.crow .area::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:var(--border)}
.crow .bar{position:absolute;top:0;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);border-radius:3px}
.crow .bar.pos{left:50%;background:var(--pos)}.crow .bar.neg{right:50%;background:var(--neg)}
.crow .val{font-variant-numeric:tabular-nums;font-weight:700;opacity:0;transition:opacity .4s ease .7s}
.crow .val.pos{color:var(--pos)}.crow .val.neg{color:var(--neg)}
.on .crow .val{opacity:1}
.sep{height:10px}

svg.chart{width:100%;height:auto;margin-top:6px}
svg.chart .grid{stroke:var(--grid)}
svg.chart text{font-size:12px;fill:var(--muted)}
svg.chart .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg.chart .dash{stroke-dasharray:7 6}
svg.chart .pt{opacity:0;transition:opacity .4s ease 1.4s}
.on svg.chart .pt{opacity:1}
svg.chart .col{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.on svg.chart .col{transform:scaleY(1)}
svg.chart .vlab{opacity:0;transition:opacity .4s ease .9s;font-weight:700;fill:var(--text)}
.on svg.chart .vlab{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:clamp(12px,1vw,14px);color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.legend i.d{border-top-style:dashed}
.legend i.sq{width:11px;height:11px;border:0;border-radius:3px}

.read{list-style:none;padding:0;margin-top:12px;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px)}
.read li{display:flex;gap:12px;font-size:clamp(15px,1.15vw,17px);line-height:1.42;opacity:0;transform:translateX(-10px);transition:all .6s ease}
.on .read li{opacity:1;transform:none}
.on .read li:nth-child(2){transition-delay:.4s}.on .read li:nth-child(3){transition-delay:.8s}.on .read li:nth-child(4){transition-delay:1.2s}.on .read li:nth-child(5){transition-delay:1.6s}.on .read li:nth-child(6){transition-delay:2s}.on .read li:nth-child(7){transition-delay:2.4s}
.read li i{flex:0 0 26px;height:26px;border-radius:50%;background:var(--visa-light);color:var(--visa);font-style:normal;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.note{font-size:clamp(11.5px,.9vw,13px);color:var(--faint);margin-top:14px;line-height:1.5;max-width:720px}

.controls{width:100%;max-width:1100px;display:flex;align-items:center;gap:14px;margin-top:14px}
.controls button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;height:36px;min-width:36px;padding:0 12px;font-size:14px;cursor:pointer}
.controls button:hover{border-color:var(--visa);color:var(--visa)}
.dots{display:flex;gap:6px;flex:1;min-width:0;justify-content:center}
.dots button{min-width:0;flex:1 1 0;max-width:30px;height:6px;padding:0;border-radius:3px;border:0;background:var(--border)}
.dots button.on{background:var(--visa)}
.progress{position:absolute;left:0;bottom:0;height:3px;background:var(--visa);width:0}
.foot{width:100%;max-width:1100px;font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.5}
@media (max-width:640px){
  .stage{height:650px}.scene{padding:22px 18px 28px}
  .controls{gap:8px}
  h1{font-size:23px}h2{font-size:18px}.big{font-size:60px}.big small{font-size:26px}
  .crow{grid-template-columns:96px 1fr 56px;font-size:12px}
  .tabs button{font-size:12px}.tabs button small{display:none}
  .read li{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){html:not(.motion) *{transition:none!important}}
.motion-btn{margin-left:auto;font-size:12.5px!important;color:var(--visa)!important;border-color:var(--visa)!important}
</style>
</head>

        const v=s.values[i], h=v/mx*(H-pt-pb), yy=H-pb-acc-h; acc+=h;
        svg.append(sv("rect",{class:"col",x:bx,y:yy,width:w,height:h,fill:COL[s.color],style:`transition-delay:${i*.05}s`}));
        if(!abs||(h>=15&&s.name!=="Otras")){
          const t=sv("text",{class:"vlab",x:bx+w/2,y:yy+h/2+4,"text-anchor":"middle",style:"font-size:11px;fill:#fff;transition-delay:"+(.5+i*.05)+"s"}); t.textContent=abs?v.toFixed(DEC):Math.round(v)+"%"; svg.append(t);
        }
      });
      if(abs){
        const y0=H-pb-acc;
        const t=sv("text",{class:"vlab",x:bx+w/2,y:y0-6,"text-anchor":"middle",style:`font-size:12px;transition-delay:${.5+i*.05}s`}); t.textContent=fmtV(tot[i],sc.fmt); svg.append(t);
        (sc.annot||[]).filter(a=>a.i===i).forEach(a=>{const u=sv("text",{class:"vlab",x:bx+w/2,y:y0-20,"text-anchor":"middle",style:"font-size:11px;fill:#B42318;font-weight:700"}); u.textContent=a.text; svg.append(u)});
      }
      if(showLbl(i,n,bw<54?2:1)){const l=sv("text",{x:bx+w/2,y:H-8,"text-anchor":"middle"}); l.textContent=sc.labels[i]; svg.append(l);}
    }
    el.append(svg);
    const lg=$("div","legend"); sc.series.forEach(s=>lg.append($("span",0,`<i class="sq" style="background:${COL[s.color]}"></i>${s.name}`))); el.append(lg);
    let tiles=null;
    if(sc.tiles){ tiles=$("div","tiles"); tiles.style.marginTop="14px"; sc.tiles.forEach(x=>tiles.append($("div",0,`<b>${x.value}</b><span>${x.label}</span>`))); el.append(tiles); }
    return ()=>{ if(tiles){ tiles.classList.remove("show"); setTimeout(()=>tiles.classList.add("show"),reduce?0:900) } };
  },
  waterfall(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h2",0,sc.title)); if(sc.sub) el.append($("p","sub",sc.sub));
    const grid=$("div","wfgrid"); el.append(grid);
    const cs=getComputedStyle(el), Wt=Math.round(el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight));
    const dos=el.clientWidth>=760, pw=dos?Math.floor((Wt-18)/2):Wt;
    let used=0; [...el.children].forEach(c=>used+=c.offsetHeight+10);
    const avail=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-used-(dos?44:90);
    const H=Math.round(Math.max(230,Math.min(dos?avail:avail/2,pw*.85)));
    const sg=v=>(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(2);
    sc.panels.forEach(pn=>{
      const wrap=$("div","wfpanel"), d=pn.end.val-pn.start.val;
      wrap.append($("h3",pn.color,`${pn.name}<span class="rng">${pn.start.label} ${pn.start.val.toFixed(1)}% → ${pn.end.label} ${pn.end.val.toFixed(1)}% (${sg(d)} pp)</span>`));
      const maxl=Math.max(...pn.steps.map(s=>s.name.length),pn.start.label.length,pn.end.label.length), pl=40,pr=6,pt=22,pb=Math.min(120,Math.max(56,Math.round(maxl*5.3)+20)),n=pn.steps.length+2,bw=(pw-pl-pr)/n;
      const cum=[pn.start.val]; pn.steps.forEach(s=>cum.push(cum[cum.length-1]+s.val));
      const lo=Math.min(...cum,pn.end.val), hi=Math.max(...cum,pn.end.val), rg=(hi-lo)||1, base=lo-rg*.35, top=hi+rg*.12;
      const y=v=>pt+(top-v)/(top-base)*(H-pt-pb);
      const svg=sv("svg",{class:"chart",viewBox:`0 0 ${pw} ${H}`,role:"img","aria-label":pn.name+": "+sc.title,style:"overflow:visible"});
      const stp=(top-base)/3; for(let k=0;k<=3;k++){const g=base+k*stp; svg.append(sv("line",{class:"grid",x1:pl,x2:pw-pr,y1:y(g),y2:y(g)})); const t=sv("text",{x:pl-6,y:y(g)+4,"text-anchor":"end"}); t.textContent=g.toFixed(1)+"%"; svg.append(t);}
      const bar=(i,v0,v1,fill,txt,tcls,lab)=>{
        const bx=pl+i*bw+bw*.14,w=bw*.72,y1=y(Math.max(v0,v1)),h=Math.max(1.5,y(Math.min(v0,v1))-y1);
        svg.append(sv("rect",{class:"col",x:bx,y:y1,width:w,height:h,rx:2,fill,style:`transition-delay:${i*.1}s`}));
        const t=sv("text",{class:"vlab",x:bx+w/2,y:y1-5,"text-anchor":"middle",style:`font-size:11px;fill:${tcls};transition-delay:${.4+i*.1}s`}); t.textContent=txt; svg.append(t);
        const l=sv("text",{x:bx+w/2+3.5,y:H-pb+8,"text-anchor":"end",transform:`rotate(-90 ${bx+w/2+3.5} ${H-pb+8})`,style:"font-size:10px"}); l.textContent=lab; svg.append(l);
        return [bx,w];
      };
      const [x0,w0]=bar(0,base,pn.start.val,COL[pn.color],pn.start.val.toFixed(1)+"%",COL[pn.color],pn.start.label);
      pn.steps.forEach((s,i)=>{
        const a=cum[i],b=cum[i+1], c=s.otros?"#98A2B3":(s.val>=0?"#027A48":"#B42318");
        const [bx,w]=bar(i+1,a,b,c,sg(s.val),c,s.name);
        svg.append(sv("line",{x1:bx-bw*.28+w*0,x2:bx,y1:y(a),y2:y(a),stroke:"#98A2B3","stroke-width":1,"stroke-dasharray":"2 2"}));
      });
      const [xe]=bar(n-1,base,pn.end.val,COL[pn.color],pn.end.val.toFixed(1)+"%",COL[pn.color],pn.end.label);
      svg.append(sv("line",{x1:xe-bw*.28,x2:xe,y1:y(cum[cum.length-1]),y2:y(cum[cum.length-1]),stroke:"#98A2B3","stroke-width":1,"stroke-dasharray":"2 2"}));
      wrap.append(svg); grid.append(wrap);
    });
    return ()=>{};
  },
  cards(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h2",0,sc.title)); if(sc.sub) el.append($("p","sub",sc.sub));
    const g=$("div","cardsgrid");
    sc.brands.forEach(b=>{ const c=$("div","bcard"); c.style.borderTopColor=COL[b.color];
      c.append($("h3",0,b.name), $("div","bigv "+(b.big.cls||""),b.big.value), $("div","bigl",b.big.label));
      b.small.forEach(x=>c.append($("div","bsmall",x)));
      g.append(c); });
    el.append(g);
    const ul=$("ul","read"); sc.items.forEach((t,i)=>ul.append($("li",0,`<i>${i+1}</i><span>${t}</span>`))); el.append(ul);
    if(sc.note) el.append($("p","note",sc.note));
    return ()=>{};
  },
  read(sc, el){
    el.append($("div","eyebrow",sc.eyebrow), $("h2",0,sc.title));
    const ul=$("ul","read"); sc.items.forEach((t,i)=>ul.append($("li",0,`<i>${i+1}</i><span>${t}</span>`))); el.append(ul);
    if(sc.note) el.append($("p","note",sc.note));
    return ()=>{};
  }
};

/* ── Reproductor ────────────────────────────────────────────────────────── */
const stage=document.getElementById("stage"), tabs=document.getElementById("tabs"), dots=document.getElementById("dots"),
      playBtn=document.getElementById("play"), foot=document.getElementById("foot");
let cur=0, rep=null, scenes=[], enters=[], playing=!reduce, timer=null, raf=null, t0=0;
const PRODS=[["T","Total"],["C","Crédito"],["D","Débito"]], PN={T:"Total (crédito + débito)",C:"Crédito",D:"Débito"};
const st={prod:"T",banco:""};
const comboKey=()=>st.banco?st.banco+"."+st.prod:st.prod;
const reps=()=>DATA.combos[comboKey()]||[];
const bancoNombre=()=>{const b=DATA.bancos.find(x=>x.id===st.banco); return b?b.nombre:""};
function parseHash(){ const h=location.hash.slice(1); if(!h) return {};
  if(!h.includes("=")) return {id:h};
  const p=new URLSearchParams(h); return {id:p.get("id")||"", prod:p.get("prod")||"T", banco:p.get("banco")||""}; }
function writeHash(){ try{ const f=(st.prod!=="T"||st.banco);
  history.replaceState(null,"","#"+(f?`id=${rep?rep.id:""}&prod=${st.prod}&banco=${st.banco}`:(rep?rep.id:""))) }catch(e){} }
const prog=$("div","progress");

function buildReport(id, idx=0){
  const lista=reps();
  rep=lista.find(r=>r.id===id)||lista[0]||null;
  writeHash();
  clearTimeout(timer); cancelAnimationFrame(raf);
  stage.innerHTML=""; dots.innerHTML=""; scenes=[]; enters=[];
  syncFilters();
  if(!rep){ stage.append($("div","empty","No hay datos suficientes para este filtro: el banco no ofrece ese producto o no tiene facturación de Visa y Mastercard a la vez.")); return; }
  rep.scenes.forEach((sc,i)=>{
    const el=$("section","scene"); stage.append(el); enters.push(R[sc.type](sc,el)); scenes.push(el);
    const b=$("button"); b.setAttribute("aria-label","Escena "+(i+1)); b.onclick=()=>go(i); dots.append(b);
  });
  stage.append(prog);
  [...tabs.children].forEach(b=>{ b.classList.toggle("on",b.dataset.id===rep.id); b.disabled=!lista.some(r=>r.id===b.dataset.id); b.title=b.disabled?"Sin datos suficientes con este filtro":"" });
  const vista=(st.banco||st.prod!=="T")?`Vista filtrada: ${st.banco?bancoNombre()+" · ":""}${PN[st.prod]}. `:"";
  foot.textContent=vista+`Fuente: Superintendencia Financiera de Colombia (datos.gov.co), corte ${DATA.corte}. Facturación = compras nacionales + exterior, crédito + débito. En débito la franquicia es estimada por proxy (la SFC no la reporta); Nequi se muestra separado de Bancolombia. Textos generados automáticamente con las cifras del período.`;
  go(idx);
}
function go(i){
  cur=(i+scenes.length)%scenes.length;
  scenes.forEach((s,k)=>s.classList.toggle("on",k===cur));
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===cur));
  enters[cur](); schedule();
}
function schedule(){
  clearTimeout(timer); cancelAnimationFrame(raf); prog.style.width="0";
  if(!playing) return;
  const dur=rep.scenes[cur].dur||6000; t0=performance.now();
  (function p(t){const k=Math.min(1,(t-t0)/dur); prog.style.width=(k*100)+"%"; if(k<1) raf=requestAnimationFrame(p)})(t0);
  timer=setTimeout(()=>go(cur+1),dur);
}
function setPlaying(v){playing=v; playBtn.textContent=v?"⏸":"▶"; schedule()}

DATA.combos.T.forEach(r=>{const b=$("button",0,`${r.tab}<small>${r.label}</small>`); b.dataset.id=r.id; b.onclick=()=>buildReport(r.id); tabs.append(b)});

/* Filtros */
const fProd=document.getElementById("f-prod"), fBanco=document.getElementById("f-banco"), fReset=document.getElementById("f-reset");
PRODS.forEach(([k,n])=>{const b=$("button",0,n); b.dataset.k=k; b.onclick=()=>{st.prod=k; buildReport(rep?rep.id:"",0)}; fProd.append(b)});
fBanco.append(new Option("Todos los bancos",""));
DATA.bancos.forEach(b=>fBanco.append(new Option(b.nombre,b.id)));
const hay=(k,b=st.banco)=>!!DATA.combos[b?b+"."+k:k];
fBanco.onchange=()=>{st.banco=fBanco.value; if(!hay(st.prod)) st.prod=PRODS.map(x=>x[0]).find(k=>hay(k))||"T"; buildReport(rep?rep.id:"",0)};
fReset.onclick=()=>{st.prod="T"; st.banco=""; buildReport(rep?rep.id:"",0)};
function syncFilters(){ [...fProd.children].forEach(b=>{b.classList.toggle("on",b.dataset.k===st.prod); b.disabled=!hay(b.dataset.k); b.title=b.disabled?"Este banco no tiene datos suficientes para este producto":""}); fBanco.value=st.banco; fReset.hidden=!(st.banco||st.prod!=="T"); }
const motionBtn=document.getElementById("motion");
if(reduce){ motionBtn.hidden=false; motionBtn.title="Tu sistema tiene las animaciones reducidas; la página las respeta hasta que las actives aquí." }
motionBtn.onclick=()=>{ reduce=false; try{localStorage.setItem("resumen-motion","1")}catch(e){}
  document.documentElement.classList.add("motion"); motionBtn.hidden=true; setPlaying(true); go(cur) };
playBtn.onclick=()=>setPlaying(!playing); playBtn.textContent=playing?"⏸":"▶";
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
addEventListener("keydown",e=>{ if(e.key==="ArrowRight")go(cur+1); else if(e.key==="ArrowLeft")go(cur-1); else if(e.key===" "){e.preventDefault();setPlaying(!playing)} });
function aplicarHash(){ const h=parseHash(); st.prod=h.prod&&DATA.combos[h.prod]?h.prod:"T"; st.banco=h.banco&&DATA.bancos.some(b=>b.id===h.banco)?h.banco:""; buildReport(h.id||""); }
addEventListener("hashchange",()=>{ const h=parseHash(); if((h.id||"")!==(rep?rep.id:"")||(h.prod||"T")!==st.prod||(h.banco||"")!==st.banco) aplicarHash() });
aplicarHash();
let rt=null, lw=stage.clientWidth, lh=stage.clientHeight;
addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  if(Math.abs(stage.clientWidth-lw)>30||Math.abs(stage.clientHeight-lh)>30){ lw=stage.clientWidth; lh=stage.clientHeight; buildReport(rep?rep.id:"",cur) } },200) });
</script>
